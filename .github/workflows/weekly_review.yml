name: Weekly Review

on:
  schedule:
    - cron: "43 13 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build site before report
        run: python scripts/build_site.py
      - name: Generate weekly report
        run: python scripts/weekly_report.py
      - name: Quality check
        run: python scripts/quality_check.py --include-site
      - name: Commit weekly report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports site
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: add weekly affiliate site report"
            git push
          fi
