name: Daily Generate

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate two articles
        run: python scripts/generate_articles.py --count 2
      - name: Pre-build quality check
        run: python scripts/quality_check.py
      - name: Build site
        run: python scripts/build_site.py
      - name: Post-build quality check
        run: python scripts/quality_check.py --include-site
      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content site data reports
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: auto-generate affiliate site content"
            git push
          fi
