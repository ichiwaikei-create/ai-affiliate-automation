name: Test

on:
  pull_request:
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "data/**"
      - "content/**"
      - "requirements*.txt"
      - ".github/workflows/test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest
